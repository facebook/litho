// Builds Yoga from source. java/, yoga/ and cmake/ are copied from the Yoga repository with Yoga's
// own layout, so java/CMakeLists.txt works unchanged.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

project.group = GROUP
version = VERSION_NAME

android {
    compileSdkVersion rootProject.compileSdkVersion
    buildToolsVersion rootProject.buildToolsVersion
    ndkVersion rootProject.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        consumerProguardFiles 'java/proguard-rules.pro'
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'java/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['java/com']
            kotlin.srcDirs = ['java/com']
            manifest.srcFile 'java/AndroidManifest.xml'
            res.srcDirs = ['java/res']
        }
    }

    namespace 'com.facebook.yoga'
}

dependencies {
    implementation deps.soloader
    implementation deps.supportCore
    compileOnly deps.jsr305
}

apply plugin: "com.vanniktech.maven.publish"

// Apps that also ship React Native get com.facebook.yoga:yoga from there. Declaring its capability
// makes Gradle report the clash instead of packaging two copies of com.facebook.yoga.
configurations.matching { it.name.endsWith('ApiElements') || it.name.endsWith('RuntimeElements') }.configureEach {
    // Declaring any capability drops the implicit one, so re-add the project's own.
    outgoing.capability("${project.group}:${project.name}:${project.version}")
    outgoing.capability("com.facebook.yoga:yoga:${project.version}")
}
