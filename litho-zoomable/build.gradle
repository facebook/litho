apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion rootProject.compileSdkVersion
    buildToolsVersion rootProject.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    namespace 'com.facebook.litho.widget.zoomable'
    lint {
        abortOnError false
    }
}

dependencies {
    api project(':litho-core')
    api project(':litho-primitive-utils')
    implementation project(':litho-rendercore')
    implementation project(':litho-rendercore-primitives')
    implementation project(':litho-rendercore-simplelist')
    implementation project(':litho-rendercore-zoomable')

    implementation deps.activity
    implementation deps.rebound
}

apply plugin: "com.vanniktech.maven.publish"
