# Default type lists for the Litho Auto Deps compiler transform.
#
# Format: '#' starts a comment, blank lines are ignored, one '<directive> <type>' per line.
# An entry matches the named type and all of its subtypes. Precedence: ignore > expand > stable.
#
# Every non-Android name here is verified by the compiler-plugin tests. Entries that are not visible
# to a particular compilation are skipped; additional author-supplied entries warn when unresolved.
#
# This is the whole configuration: the plugin takes no compiler options, so there is no per-target
# override. Adding a type here applies it everywhere the plugin runs.

# Ambient values, not reactive inputs. Dropped from the inferred set entirely.
# This under-captures on purpose -- every entry here is a deliberate soundness exception.
ignore  com.facebook.litho.ComponentContext
ignore  com.facebook.litho.ComponentScope
ignore  com.facebook.rendercore.ResourceResolver
ignore  com.facebook.rendercore.primitives.MountConfigurationScope
ignore  android.content.Context
ignore  android.content.res.Resources

# No meaningful equivalence. Expanded to the value's own inputs.
expand  com.facebook.rendercore.LayoutResult

# Identity equality is acceptable. Kept as a dependency, with no unstable-capture warning.

# Deliberately absent: the Custom Layout RFC's `Measurable` and `Placeable`. They are the motivating
# `expand` entries but neither type exists yet, so naming them here would only produce warnings.
# Add them with the API, in Phase 2.
