apply plugin: 'java-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.jvm'

project.group = GROUP
version = VERSION_NAME

gradlePlugin {
    plugins {
        litho {
            id = 'com.facebook.litho'
            implementationClass = 'com.facebook.litho.gradle.LithoGradlePlugin'
        }
    }
}

// The plugin adds the compiler plugin artifact of its own version, so bake that version in.
def generateLithoVersion = tasks.register('generateLithoVersion') {
    def outputDir = layout.buildDirectory.dir('generated/source/lithoVersion')
    def lithoVersion = VERSION_NAME
    inputs.property('lithoVersion', lithoVersion)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file('com/facebook/litho/gradle/LithoVersion.kt').asFile
        file.parentFile.mkdirs()
        file.text = "package com.facebook.litho.gradle\n\ninternal const val LITHO_VERSION = \"${lithoVersion}\"\n"
    }
}

sourceSets.main.kotlin.srcDir(generateLithoVersion)

dependencies {
    compileOnly "org.jetbrains.kotlin:kotlin-gradle-plugin-api:${KOTLIN_VERSION}"
}

apply plugin: "com.vanniktech.maven.publish"
